[package]
name = "sqlparse-rs"
version = "0.1.0"
edition = "2021"
description = "Rust core for sqlparse's lexer and split(): identical tokens and statements, much faster"
license = "BSD-3-Clause"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
