[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "sqlparse-rs"
version = "0.1.0"
description = "Drop-in Rust speedup for sqlparse: split() and the lexer give identical results, much faster"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.9"
dependencies = ["sqlparse==0.6.1"]

[tool.maturin]
module-name = "sqlparse_rs._core"
python-source = "python"
